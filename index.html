<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 80px;
            overflow: hidden;
        }
        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 60px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 40px 0;
        }
        .content h2 {
            font-size: 50px;
            margin-bottom: 30px;
        }
        .content p {
            font-size: 36px;
            line-height: 1.5;
        }
        .footer {
            text-align: center;
            font-size: 28px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>INFO TERBARU</h1>
    </div>
    <div class="content">
        <h2>Selamat Datang</h2>
        <p>Silakan gunakan layar sentuh atau lihat informasi promo menarik hari ini di sini.</p>
    </div>
    <div class="footer">
        <p>© 2026 Perusahaan Anda</p>
    </div>
</body>
</html>
