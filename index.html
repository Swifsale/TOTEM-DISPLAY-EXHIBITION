<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SWIF ASIA — Totem Display</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js" onerror="window.__noGltf=true"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js" onerror="window.__noStl=true"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/OBJLoader.js" onerror="window.__noObj=true"></script>
</head>
<body>
<div id="fit">
  <div class="page"><div class="frame">
    <div class="rib tl"></div><div class="rib br"></div>

    <header>
      <div class="logo" id="headerLogo"></div>
      <div class="co"><b id="coName"></b><span id="coSub"></span></div>
      <div class="ev"><b id="evLine1"></b><span id="evLine2"></span></div>
    </header>

    <div id="slides"></div>

    <div class="picker" id="picker"></div>

    <footer>
      <div class="slog" id="footerSlog"></div>
      <div class="cta" id="footerCta"></div>
    </footer>

    <button class="nav" id="prev" aria-label="Slide sebelumnya">&#10094;</button>
    <button class="nav" id="next" aria-label="Slide berikutnya">&#10095;</button>
    <div class="dots" id="dots"></div>
  </div></div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
